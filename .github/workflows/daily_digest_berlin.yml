name: Berlin Edition

# WEEKLY regional re-send of the primary Curated Canopy for a reader in Berlin,
# Germany (Central European Time). Per the reader's request this edition goes out
# ONCE A WEEK — Sunday morning — rather than twice daily. It does NOT re-fetch or
# re-curate: it reuses the primary edition's committed curated_data.json,
# re-localizes "From the Garden", The Larder's seasonal food note, and the local
# sun times, then emails the EMAIL_TO_BERLIN list. No web publish, no history writes.
#
# Timing: Berlin shares the Zürich source's time zone, and the morning content isn't
# committed until ~06:15 UTC (~08:15 Berlin). So Sunday's send fires 06:23 UTC —
# just after the content is ready — landing ~08:30–10:00 local.

on:
  schedule:
    - cron: "23 6 * * 0"    # Sunday morning — just after the day's content commits
  workflow_dispatch:

jobs:
  berlin-edition:
    name: Berlin weekly re-send
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
      EDITION_TZ: Europe/Berlin
      GARDEN_LOCALE: "Berlin, Germany"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet anthropic google-api-python-client python-dateutil requests beautifulsoup4

      - name: Re-localize + send the Berlin edition
        env:
          CLAUDE_API_KEY:        ${{ secrets.CLAUDE_API_KEY }}
          EMAIL_USER:            ${{ secrets.EMAIL_USER }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_SERVER:           ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:             ${{ secrets.SMTP_PORT }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO_BERLIN }}
          RECIPIENT_NAME:        ${{ secrets.RECIPIENT_NAME_BERLIN }}
        run: python renderer.py --regional
