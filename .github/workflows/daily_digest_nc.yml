name: North Carolina Edition

# Regional re-send of the primary Curated Canopy for a reader in North Carolina
# (Raleigh / Triangle, US Eastern). It does NOT re-fetch or re-curate — it reuses
# the primary edition's committed curated_data.json, re-localizes "From the Garden",
# The Larder's seasonal food note, and the local sun times, then emails it to the
# EMAIL_TO_NC list at local morning/evening. No web publish, no history.
#
# Timing: no `schedule:` on purpose. GitHub's cron queue was starting this
# job hours late. Instead it is triggered via workflow_dispatch:
#   dispatched by Claude routines at 06:58 and 18:58 America/New_York (≈07:00 / 19:00 local).
# It can also be run by hand from the Actions tab.

on:
  workflow_dispatch:

jobs:
  nc-edition:
    name: North Carolina re-send
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      EDITION_TZ: America/New_York
      GARDEN_LOCALE: "Raleigh, North Carolina"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet anthropic google-api-python-client python-dateutil requests beautifulsoup4

      - name: Re-localize + send the North Carolina edition
        env:
          CLAUDE_API_KEY:        ${{ secrets.CLAUDE_API_KEY }}
          EMAIL_USER:            ${{ secrets.EMAIL_USER }}
          SMTP_USER:             ${{ secrets.SMTP_USER }}
          SMTP_PASS:             ${{ secrets.SMTP_PASS }}
          SMTP_HOST:             ${{ secrets.SMTP_HOST }}
          SMTP_SERVER:           ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:             ${{ secrets.SMTP_PORT }}
          EMAIL_TO:              ${{ secrets.EMAIL_TO_NC }}
          RECIPIENT_NAME:        ${{ secrets.RECIPIENT_NAME_NC }}
        run: python renderer.py --regional
